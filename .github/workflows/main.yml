name: FinQIR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FinQIR
        run: python -m pip install -e ".[test,dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s test -v
      - name: Check formatting
        run: python -m black --check finqir test tools docs
      - name: Run static analysis
        run: |
          python -m pylint --persistent=n -rn finqir test tools
          python -m mypy finqir test tools
      - name: Check source headers
        run: python tools/verify_headers.py finqir test tools

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: finqir-distributions
          path: dist/
